name: Build platform downloads

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-downloads.yml"
      - "StreamTopo Guard/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest

    defaults:
      run:
        working-directory: StreamTopo Guard

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run core tests
        run: python -m tests.unit.core.test_tda_guard

      - name: Build native download
        run: python build_download.py

      - name: Upload platform download
        uses: actions/upload-artifact@v4
        with:
          name: TopoGuard-${{ matrix.platform }}-${{ runner.arch }}
          path: StreamTopo Guard/downloads/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30
