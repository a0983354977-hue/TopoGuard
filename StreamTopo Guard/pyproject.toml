[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topoguard"
version = "1.0.0"
description = "Live telemetry, topological analysis, and formal boundary auditing"
requires-python = ">=3.10"
dependencies = [
    "gudhi>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "scapy>=2.5.0",
    "scikit-learn>=1.3.0",
    "z3-solver>=4.12.0",
]

[project.scripts]
topoguard-cli = "topoguard_cli:main"

[tool.setuptools]
py-modules = [
    "baseline",
    "correlator",
    "data_adapter",
    "data_sources",
    "defensive",
    "ebpf_collector",
    "extension_plugins",
    "hybrid_engine",
    "notifications",
    "polars_engine",
    "siem",
    "tda_engine",
    "topoguard_cli",
]

[tool.setuptools.packages.find]
include = ["adapters*"]
